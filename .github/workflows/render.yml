name: Render Monochrome Reels

on:
  workflow_dispatch:
    inputs:
      chat_id:
        description: 'Telegram Chat ID'
        required: true
        default: '871931831'
      video_mode:
        description: 'Which Reels to render (all, a, b)'
        required: false
        default: 'all'
      data_json:
        description: 'JSON Content'
        required: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: npm install

      - name: Render Reels Videos
        env:
          INPUT_JSON: ${{ github.event.inputs.data_json }}
          CHAT_ID: ${{ github.event.inputs.chat_id }}
          VIDEO_MODE: ${{ github.event.inputs.video_mode }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: node render.js
