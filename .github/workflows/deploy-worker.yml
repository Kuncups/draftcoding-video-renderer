name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure Wrangler OAuth
        env:
          WRANGLER_TOML_CONFIG: ${{ secrets.WRANGLER_TOML_CONFIG }}
        run: |
          mkdir -p ~/.config/.wrangler/config ~/.wrangler/config
          printf "%s" "$WRANGLER_TOML_CONFIG" > ~/.config/.wrangler/config/default.toml
          printf "%s" "$WRANGLER_TOML_CONFIG" > ~/.wrangler/config/default.toml

      - name: Install & Deploy Worker
        working-directory: ./worker
        run: |
          npm install
          npx wrangler deploy
          curl -s "https://draftcoding-content-bot.myusufdananr.workers.dev/trigger?mode=both"
